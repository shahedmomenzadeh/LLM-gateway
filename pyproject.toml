[project]
name = "llm-gateway"
version = "1.0.0"
description = "OpenAI-compatible proxy with multi-provider waterfall fallback for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
llm-gateway = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
